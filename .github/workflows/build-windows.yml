# Compile check on a GitHub runner (MSVC preinstalled, no admin needed locally).
# Uses the latest LibreOffice "stable" release: the office MSI gives types.rdb/offapi.rdb and the
# URE DLLs that cppumaker needs; the SDK MSI gives headers, import libs and cppumaker.
# Both are unpacked with an administrative extract (msiexec /a), nothing is installed.
# Manual only (Actions > Run workflow): pushes do not start a remote build.
name: build-windows
on:
  workflow_dispatch:

env:
  QUICKJS_VERSION: "0.18.0"
  WEBVIEW2_VERSION: "1.0.4370.26"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS tests
        run: |
          node tests/test_runtime.js
          node tests/test_api_shim.js

      - name: Fetch LibreOffice and SDK (latest stable, administrative extract)
        shell: pwsh
        run: |
          $index = (Invoke-WebRequest https://download.documentfoundation.org/libreoffice/stable/).Content
          $ver = ([regex]::Matches($index, 'href="(\d+\.\d+\.\d+)/"') | ForEach-Object { $_.Groups[1].Value } |
                  Sort-Object { [version]$_ } | Select-Object -Last 1)
          Write-Output "LibreOffice $ver"
          $base = "https://download.documentfoundation.org/libreoffice/stable/$ver/win/x86_64"
          Invoke-WebRequest "$base/LibreOffice_${ver}_Win_x86-64.msi" -OutFile lo.msi
          Invoke-WebRequest "$base/LibreOffice_${ver}_Win_x86-64_sdk.msi" -OutFile sdk.msi
          Start-Process msiexec -ArgumentList '/a lo.msi /qn TARGETDIR=C:\lo' -Wait
          Start-Process msiexec -ArgumentList '/a sdk.msi /qn TARGETDIR=C:\lo' -Wait
          $program = (Get-ChildItem C:\lo -Recurse -Filter types.rdb | Select-Object -First 1).DirectoryName
          $sdk = (Get-ChildItem C:\lo -Recurse -Filter cppumaker.exe | Select-Object -First 1).Directory.Parent.FullName
          Write-Output "LO_PROGRAM=$program"; Write-Output "LO_SDK=$sdk"
          "LO_PROGRAM=$program" | Out-File $env:GITHUB_ENV -Append
          "LO_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append
          "LO_VERSION=$ver" | Out-File $env:GITHUB_ENV -Append

      - name: Fetch third_party
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          Invoke-WebRequest "https://github.com/quickjs-ng/quickjs/archive/refs/tags/v$env:QUICKJS_VERSION.tar.gz" -OutFile q.tgz
          tar -xzf q.tgz -C third_party
          Rename-Item "third_party/quickjs-$env:QUICKJS_VERSION" quickjs-ng
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WEBVIEW2_VERSION/microsoft.web.webview2.$env:WEBVIEW2_VERSION.nupkg" -OutFile w.zip
          Expand-Archive w.zip third_party/webview2/pkg

      - name: Generate UNO headers
        shell: pwsh
        run: scripts/gen_uno_headers.ps1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: |
          # Errors are also published as annotations (readable through the API without log access).
          $ErrorActionPreference = 'Continue'
          try { & scripts/build.ps1 *>&1 | Tee-Object -FilePath build.log } catch { "SCRIPT THROW: $_" | Tee-Object -FilePath build.log -Append }
          if (-not (Test-Path build/bin/pluginhost.dll)) {
            # GitHub keeps 10 annotations per step: send the errors as ONE multi-line annotation.
            $lines = @(Select-String -Path build.log -Pattern ': error |: fatal error|CMake Error|error LNK|LNK\d{4}|^FAILED:|THROW|cannot open' |
                       ForEach-Object { $_.Line } | Select-Object -Unique)
            if ($lines.Count -eq 0) { $lines = @(Get-Content build.log -Tail 40) }
            $text = (($lines | Select-Object -First 80) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=build::$text"
            exit 1
          }

      - name: Pack OXT
        shell: pwsh
        run: scripts/pack.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginhost-${{ env.LO_VERSION }}
          path: |
            build/bin/*.dll
            dist/*.oxt
            build/.ninja_log
