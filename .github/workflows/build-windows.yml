# DRAFT, never run. Purpose: compile-check the host on a GitHub runner, because MSVC is preinstalled there
# and no admin rights are needed. Adjust LO_VERSION to a release that exists on download.documentfoundation.org.
name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [ main, 'draft/**' ]

env:
  LO_VERSION: "25.8.0"
  QUICKJS_VERSION: "0.18.0"
  WEBVIEW2_VERSION: "1.0.4370.26"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: JS tests
        run: |
          node tests/test_runtime.js
          node tests/test_api_shim.js

      - name: Fetch LibreOffice SDK (administrative extract, no install)
        shell: pwsh
        run: |
          $base = "https://download.documentfoundation.org/libreoffice/stable/$env:LO_VERSION/win/x86_64"
          Invoke-WebRequest "$base/LibreOffice_${env:LO_VERSION}_Win_x86-64_sdk.msi" -OutFile sdk.msi
          Start-Process msiexec -ArgumentList '/a sdk.msi /qn TARGETDIR=C:\lo-sdk' -Wait
          "LO_SDK=" + (Get-ChildItem C:\lo-sdk -Directory -Recurse -Filter sdk | Select-Object -First 1).FullName | Out-File $env:GITHUB_ENV -Append

      - name: Fetch third_party
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          Invoke-WebRequest "https://github.com/quickjs-ng/quickjs/archive/refs/tags/v$env:QUICKJS_VERSION.tar.gz" -OutFile q.tgz
          tar -xzf q.tgz -C third_party
          Rename-Item "third_party/quickjs-$env:QUICKJS_VERSION" quickjs-ng
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$env:WEBVIEW2_VERSION/microsoft.web.webview2.$env:WEBVIEW2_VERSION.nupkg" -OutFile w.zip
          Expand-Archive w.zip third_party/webview2/pkg

      - name: Generate UNO headers
        shell: pwsh
        run: scripts/gen_uno_headers.ps1

      - name: Build
        shell: pwsh
        run: scripts/build.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: build/**/*.dll
